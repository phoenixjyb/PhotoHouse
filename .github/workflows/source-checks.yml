name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify current source ledger
        run: python tools/verify_current_source.py
      - name: Test standard-library source tools
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - run: python -m pip install --require-hashes -r config/requirements-dev.lock
      - run: python tools/check.py api
  web-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.17.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r config/requirements-dev.lock
      - name: Install locked Playwright Core
        working-directory: server/tests/security/browser-tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium headless shell and system dependencies
        working-directory: server/tests/security/browser-tooling
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/photohouse-playwright-browsers
        run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - name: Run generated Web browser checks
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/server/tests/security/browser-tooling/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/photohouse-playwright-browsers
          PH_BROWSER_ARTIFACTS: ${{ runner.temp }}/photohouse-web-artifacts
        run: python tools/check.py web
  windows-private-readers:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r config/requirements-api.lock
      - name: Check native private readers without providers
        shell: pwsh
        run: |
          $cases = @('test_private_storage.py', 'test_model_deployment.py', 'test_model_qualification.py', 'test_windows_tts.py', 'test_memoir_quality_canary.py', 'test_bounded_windows_job.py')
          $failed = $false
          foreach ($case in $cases) {
            python -m unittest discover -s server/tests/security -p $case
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r config/requirements-dev.lock
      - name: Check generated database and package contracts
        run: python tools/check.py windows-cpu
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install explicit Android SDK components
        run: |
          ph_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ph_sdk_root"
          ph_sdk_manager="$ph_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ph_sdk_manager"
          "$ph_sdk_manager" 'platforms;android-34' 'build-tools;34.0.0'
      - run: python3 tools/check.py android
      - name: Summarize existing Android unit reports
        if: always()
        run: python3 tools/android_test_report.py
