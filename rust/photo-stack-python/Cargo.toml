[package]
name = "photohouse-photo-stack"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "photohouse_photo_stack"
crate-type = ["cdylib"]

[dependencies]
photo-stack-core = { path = "../photo-stack-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
