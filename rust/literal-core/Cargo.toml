[package]
name = "literal-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Bounded exact literal-search quality fast path"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
