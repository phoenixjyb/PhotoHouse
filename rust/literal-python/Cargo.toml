[package]
name = "photohouse-literal-python"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "photohouse_literal_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
literal-core = { path = "../literal-core" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
